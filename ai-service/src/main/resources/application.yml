server:
  port: 8087

  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  application:
    name: ai-service

  # ─── Database (Chọc thẳng vào DB dùng chung) ────────────────────────
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:fnb_db}?TimeZone=Asia/Ho_Chi_Minh"
    username: ${DB_USER:fnb_user}
    password: ${DB_PASS:fnb_pass}
    driver-class-name: org.postgresql.Driver

  # ─── Redis (Lưu context chat / Cache) ──────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ─── Tắt Flyway vì ai-service không tự quản lý migration DB ─────────
  flyway:
    enabled: false

# ─── LangChain4j: Multi-Model Configuration ──────────────────────
# Smart Model: Gemini (Tư vấn, phân tích chính)
# Fast Model: Groq (Rewriter, Router, Summarizer - siêu nhanh)
langchain4j:
  open-ai:
    chat-model:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai/
      api-key: ${GEMINI_API_KEY}
      model-name: gemini-3.1-flash-lite
      temperature: 0.0
      max-tokens: 1024
      log-requests: false
      log-responses: false
    # Embedding model: Dùng all-MiniLM-L6-v2 cục bộ, không tốn token
    embedding-model:
      enabled: false   # Tắt OpenAI embedding, dùng local model thay thế

# ─── AI Models (Groq Fast Model / Gemini Fallback) ───────────────
ai:
  gemini:
    fallback-model-name: ${GEMINI_FALLBACK_MODEL:gemini-3.5-flash}
  groq:
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    api-key: ${GROQ_API_KEY:}
    model-name: ${GROQ_MODEL:llama-3.1-8b-instant}

# ─── Eureka ───────────────────────────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

# ─── JWT (lấy secret chung từ biến môi trường) ───────────────────────
jwt:
  secret: ${JWT_SECRET}

# ─── Internal Auth ───────────────────────────────────────────────────
internal:
  secret: ${INTERNAL_SECRET:fnb-internal-secret-2024}


# ─── Logging ──────────────────────────────────────────────────────────
logging:
  level:
    com.fnb.ai: DEBUG
    dev.langchain4j: INFO

# ─── Actuator ─────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info
